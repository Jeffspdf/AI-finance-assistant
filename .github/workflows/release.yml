name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt
      - run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = '0.8.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          ./packaging/build.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-installers
          path: release/*
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already exists; leaving published assets unchanged.'; exit 0 }
          gh release create "$env:GITHUB_REF_NAME" release/* --draft --title "AI Finance Helper $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
