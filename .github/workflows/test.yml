name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Desktop self-test
        shell: pwsh
        run: |
          $env:FINANCE_DESKTOP_DATA_DIR = Join-Path $env:RUNNER_TEMP 'review-smoke'
          python desktop.py --self-test
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$env:FINANCE_DESKTOP_DATA_DIR/self-test.ok")) { throw 'Desktop self-test failed' }
      - run: python scripts/evaluate_ai.py
